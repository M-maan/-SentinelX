services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx
      POSTGRES_DB: sentinelx
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinelx:sentinelx@postgres:5432/sentinelx
      REDIS_URL: redis://redis:6379
    depends_on: [postgres, redis]
    ports: ["3001:3001"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      PORT: 3000
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  postgres_data:
